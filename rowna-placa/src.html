<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: narzędzie analityczne — nagłówek z zapisem, pasek zakładek, jedna kolumna treści z sekcjami kart tam, gdzie coś jest osobnym obiektem */
:root {
  --bg: #F3F5F4; --surface: #FFFFFF; --surface-2: #E9EEEC; --line: #D3DBD8;
  --fg: #16211F; --muted: #5A6A66; --accent: #1E5B4F; --accent-fg: #FFFFFF;
  --k: #8A4FB8; --m: #1F7F8C;
  --ok: #2E7D4F; --warn: #B7791F; --crit: #B8412F;
  --ok-bg: #E3F1E8; --warn-bg: #FBF0DC; --crit-bg: #F8E3DF;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111816; --surface: #19221F; --surface-2: #222D2A; --line: #33413D;
  --fg: #E6EDEA; --muted: #9AAAA5; --accent: #6FC2AE; --accent-fg: #0D1F1B;
  --k: #C197E6; --m: #5CC3CF;
  --ok: #6CC48E; --warn: #E3B15C; --crit: #EE8A78;
  --ok-bg: #1B3325; --warn-bg: #3A2E17; --crit-bg: #3D211C; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111816; --surface: #19221F; --surface-2: #222D2A; --line: #33413D;
  --fg: #E6EDEA; --muted: #9AAAA5; --accent: #6FC2AE; --accent-fg: #0D1F1B;
  --k: #C197E6; --m: #5CC3CF;
  --ok: #6CC48E; --warn: #E3B15C; --crit: #EE8A78;
  --ok-bg: #1B3325; --warn-bg: #3A2E17; --crit-bg: #3D211C; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5 }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2 }
h1 { font-size: 1.6rem; font-weight: 700 }
h2 { font-size: 1.25rem; font-weight: 700 }
h3 { font-size: 1.02rem; font-weight: 600 }
p { margin: 0 }
.muted { color: var(--muted) }
.small { font-size: .85rem }
.num, td.n, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .88em }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line) }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 12px 8px }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0 }
.brand .eq { font-family: var(--f-mono); color: var(--accent); font-weight: 600 }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.save-state { font-size: .82rem; color: var(--muted) }
.save-state.dirty { color: var(--warn); font-weight: 600 }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none }
nav.tabs button { flex: none; border: 0; background: none; color: var(--muted); font: 600 .92rem var(--f-body); padding: 8px 12px; border-bottom: 3px solid transparent; cursor: pointer }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent) }
nav.tabs button:hover { color: var(--fg) }

button, .btn { font: 600 .9rem var(--f-body); border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 7px 12px; cursor: pointer }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
button:disabled { opacity: .5; cursor: default }
button.ghost { background: none; border-color: transparent; color: var(--muted); padding: 4px 8px }
button.ghost:hover { color: var(--crit) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input, select, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 100% }
textarea { width: 100%; min-height: 64px; resize: vertical }
label.f { display: grid; gap: 4px; font-size: .85rem; color: var(--muted) }

main { display: grid; gap: 20px; padding-top: 20px }
section { display: grid; gap: 12px; min-width: 0 }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0 }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; align-content: start }
.kpi .lbl { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }
.kpi .val { font-family: var(--f-display); font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums }
.kpi .sub { font-size: .84rem; color: var(--muted) }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap }
.chip.ok { background: var(--ok-bg); color: var(--ok) }
.chip.warn { background: var(--warn-bg); color: var(--warn) }
.chip.crit { background: var(--crit-bg); color: var(--crit) }
.chip.cat { background: var(--surface-2); color: var(--fg); font-family: var(--f-mono) }
.sx { font-weight: 700; font-family: var(--f-mono) }
.sx.K { color: var(--k) } .sx.M { color: var(--m) }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50% }
.dot.K { background: var(--k) } .dot.M { background: var(--m) }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .84rem; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: .9rem }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle }
th { font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); font-weight: 700; white-space: nowrap }
td.n, th.n { text-align: right }
tr:last-child td { border-bottom: 0 }
tbody tr:hover { background: color-mix(in srgb, var(--surface-2) 50%, transparent) }
td input[type=number] { width: 96px; text-align: right; font-family: var(--f-mono); font-size: .85rem }
td select { font-size: .85rem }
select.lvl { width: 48px; padding: 3px 4px; font-family: var(--f-mono) }
th.rot { writing-mode: vertical-rl; transform: rotate(180deg); height: 140px; text-transform: none; letter-spacing: 0; font-size: .78rem; text-align: left; vertical-align: bottom }
th.grp { text-align: center; border-left: 1px solid var(--line) }

.alerts { display: grid; gap: 8px }
.alert { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 8px; border-left: 4px solid; font-size: .92rem }
.alert.crit { background: var(--crit-bg); border-color: var(--crit) }
.alert.warn { background: var(--warn-bg); border-color: var(--warn) }
.alert.ok { background: var(--ok-bg); border-color: var(--ok) }
.alert b { font-weight: 700 }

.cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px }
.catcard { display: grid; gap: 10px; align-content: start }
.catcard .h { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap }
.catcard .roman { font-family: var(--f-display); font-size: 1.5rem; font-weight: 700 }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.pair > div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px }
.pair .v { font-family: var(--f-mono); font-weight: 600 }
ul.plain { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; font-size: .88rem }

.timeline { display: grid; gap: 0; border-left: 2px solid var(--line); margin-left: 6px }
.tl { position: relative; padding: 0 0 18px 20px; display: grid; gap: 4px }
.tl::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted) }
.tl.past::before { background: var(--ok); border-color: var(--ok) }
.tl.next::before { background: var(--warn); border-color: var(--warn) }
.tl .d { font-family: var(--f-mono); font-size: .85rem; color: var(--muted) }
.check { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start }
.check:last-child { border-bottom: 0 }
.check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent) }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end }
.banner { background: var(--warn-bg); color: var(--fg); border: 1px solid var(--warn); border-radius: 8px; padding: 8px 12px; font-size: .88rem }
svg text { fill: var(--muted); font-family: var(--f-body); font-size: 12px }
svg .axis { stroke: var(--line) }
.chart { width: 100%; height: auto; display: block }
.range-out { font-family: var(--f-mono); font-weight: 600 }
.copybox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-weight: 600; z-index: 9; max-width: calc(100% - 32px) }
details summary { cursor: pointer; font-weight: 600 }
@media (prefers-reduced-motion: no-preference) { nav.tabs button { transition: color .15s, border-color .15s } }
@media (max-width: 560px) { h1 { font-size: 1.3rem } .kpi .val { font-size: 1.6rem } }
</style>

<script type="application/json" id="seed">/*SEED*/</script>
<script>
(function () {
"use strict";
const TABS = [
  ["pulpit", "Pulpit"], ["wartosciowanie", "Wartościowanie"], ["kategorie", "Kategorie"],
  ["pracownicy", "Pracownicy"], ["widelki", "Widełki"], ["symulacja", "Wyrównanie"],
  ["obowiazki", "Obowiązki"], ["ustawienia", "Ustawienia"]
];
const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
const SEED = JSON.parse(document.getElementById("seed").textContent);
let S = null;             // stan
let dirty = false;
let tab = "pulpit";
let filt = { cat: "", sex: "", q: "" };
let sim = { tol: null, basis: "total" };
let payBasis = "total";   // total | base
let rangeMethod = "pct";
let artifactNs = null, downloadsNs = null, readOnly = false;

try { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) tab = h; } catch (e) {}
try { const t = localStorage.getItem("rp-tab"); if (!location.hash && t && TABS.some(x => x[0] === t)) tab = t; } catch (e) {}

// ---------- obliczenia ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 0) => (isFinite(n) ? n : 0).toLocaleString("pl-PL", { minimumFractionDigits: d, maximumFractionDigits: d });
const zl = n => fmt(n) + " zł";
const pct = (n, d = 1) => (n == null || !isFinite(n)) ? "—" : (n > 0 ? "+" : "") + fmt(n, d) + "%";
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN;
const quant = (a, q) => { if (!a.length) return NaN; const s = [...a].sort((x, y) => x - y); const p = (s.length - 1) * q; const lo = Math.floor(p), hi = Math.ceil(p); return s[lo] + (s[hi] - s[lo]) * (p - lo); };
const median = a => quant(a, .5);
const posById = id => S.positions.find(p => p.id === id);
function points(p) { return S.criteria.reduce((sum, c) => sum + c.max * (Number(p.levels[c.id]) || 1) / 5, 0); }
function maxPoints() { return S.criteria.reduce((s, c) => s + c.max, 0); }
function catOf(pts) { const b = S.company.bands; let i = 0; for (let k = 0; k < b.length; k++) if (pts >= b[k]) i = k; return i; }
function empCat(e) { const p = posById(e.pos); return p ? catOf(points(p)) : -1; }
function pay(e, basis = payBasis) { const f = Number(e.fte) || 1; return ((Number(e.base) || 0) + (basis === "total" ? (Number(e.variable) || 0) : 0)) / f; }
function gapOf(list, basis = payBasis, fn = mean) {
  const k = list.filter(e => e.sex === "K").map(e => pay(e, basis)), m = list.filter(e => e.sex === "M").map(e => pay(e, basis));
  if (!k.length || !m.length) return null;
  const mk = fn(k), mm = fn(m);
  return (mm - mk) / mm * 100;
}
function catLabel(i) { const b = S.company.bands; return ROMAN[i] + " · " + b[i] + (b[i + 1] != null ? "–" + (b[i + 1] - 1) : "+") + " pkt"; }
function catStats() {
  const th = Number(S.company.threshold) || 5;
  return S.company.bands.map((_, i) => {
    const emps = S.employees.filter(e => empCat(e) === i);
    const K = emps.filter(e => e.sex === "K"), M = emps.filter(e => e.sex === "M");
    const g = gapOf(emps), gm = gapOf(emps, payBasis, median), gb = gapOf(emps, "base");
    const pos = S.positions.filter(p => catOf(points(p)) === i);
    const note = S.notes[i] || {};
    let level = "ok";
    if (g == null) level = "na"; else if (Math.abs(g) >= th) level = note.status === "justified" ? "justified" : "crit"; else if (Math.abs(g) >= th * .6) level = "warn";
    return { i, emps, K, M, g, gm, gb, pos, level, small: K.length < 3 || M.length < 3,
      meanK: mean(K.map(e => pay(e))), meanM: mean(M.map(e => pay(e))) };
  });
}
function quartiles() {
  const s = [...S.employees].sort((a, b) => pay(a) - pay(b));
  const n = s.length; const out = [];
  for (let q = 0; q < 4; q++) {
    const part = s.slice(Math.round(q * n / 4), Math.round((q + 1) * n / 4));
    out.push({ k: part.filter(e => e.sex === "K").length, m: part.filter(e => e.sex === "M").length, lo: part.length ? pay(part[0]) : 0, hi: part.length ? pay(part[part.length - 1]) : 0 });
  }
  return out;
}
function reportDuty(h) {
  h = Number(h) || 0;
  if (h >= 250) return { lvl: "crit", t: "Raport co roku", d: "Pierwszy raport do 7 czerwca 2027 r. (za 2026 r.), potem corocznie." };
  if (h >= 150) return { lvl: "warn", t: "Raport co 3 lata", d: "Pierwszy raport do 7 czerwca 2027 r. (za 2026 r.), potem co trzy lata." };
  if (h >= 100) return { lvl: "warn", t: "Raport co 3 lata od 2031 r.", d: "Pierwszy raport do 7 czerwca 2031 r., potem co trzy lata." };
  return { lvl: "ok", t: "Brak obowiązku raportu", d: "Poniżej 100 pracowników dyrektywa nie nakłada obowiązku raportowania luki (pozostałe obowiązki jawności obowiązują)." };
}
// wyrównanie: podnosimy najniżej opłacane osoby z grupy o niższej średniej do progu F (wyszukiwanie binarne), aż luka ≤ tolerancja
function equalize(emps, tol, basis) {
  const K = emps.filter(e => e.sex === "K"), M = emps.filter(e => e.sex === "M");
  if (!K.length || !M.length) return { cost: 0, raises: [] };
  const mk = mean(K.map(e => pay(e, basis))), mm = mean(M.map(e => pay(e, basis)));
  const low = mk < mm ? K : M, high = mk < mm ? M : K;
  const target = mean(high.map(e => pay(e, basis))) * (1 - tol / 100);
  const cur = mean(low.map(e => pay(e, basis)));
  if (cur >= target) return { cost: 0, raises: [], lowSex: low[0].sex };
  const meanAt = F => mean(low.map(e => Math.max(pay(e, basis), F)));
  let a = Math.min(...low.map(e => pay(e, basis))), b = target * 3;
  for (let i = 0; i < 60; i++) { const mid = (a + b) / 2; if (meanAt(mid) < target) a = mid; else b = mid; }
  const F = Math.ceil(b / 10) * 10;
  const raises = low.filter(e => pay(e, basis) < F).map(e => ({ e, from: pay(e, basis), to: F, cost: (F - pay(e, basis)) * (Number(e.fte) || 1) }));
  return { cost: raises.reduce((s, r) => s + r.cost, 0), raises, floor: F, lowSex: low[0].sex };
}
function rangeFor(i) {
  const emps = S.employees.filter(e => empCat(e) === i).map(e => pay(e, "base"));
  if (!emps.length) return null;
  let lo, hi;
  if (rangeMethod === "pct") { lo = quant(emps, .1); hi = quant(emps, .9); }
  else { const md = median(emps); lo = md * .85; hi = md * 1.15; }
  if (hi - lo < 400) { const c = (lo + hi) / 2; lo = c - 200; hi = c + 200; }
  return { lo: Math.floor(lo / 100) * 100, hi: Math.ceil(hi / 100) * 100, n: emps.length };
}

// ---------- wykresy (SVG) ----------
function gapChart(stats) {
  const th = Number(S.company.threshold) || 5;
  const rows = stats.filter(s => s.g != null || s.emps.length);
  const W = 520, rowH = 34, top = 26, left = 120, right = 64, H = top + rows.length * rowH + 30;
  const mx = Math.max(10, ...rows.map(s => Math.abs(s.g || 0))) * 1.1;
  const x = v => left + (v + mx) / (2 * mx) * (W - left - right);
  let o = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Luka płacowa w kategoriach">`;
  o += `<rect x="${x(-th)}" y="${top - 6}" width="${x(th) - x(-th)}" height="${rows.length * rowH + 6}" fill="var(--ok-bg)"/>`;
  const ticks = [-Math.floor(mx / 5) * 5, 0, Math.floor(mx / 5) * 5];
  ticks.forEach(t => { o += `<line class="axis" x1="${x(t)}" x2="${x(t)}" y1="${top - 6}" y2="${top + rows.length * rowH}" stroke-dasharray="${t ? "3 3" : "0"}"/><text x="${x(t)}" y="${H - 12}" text-anchor="middle">${t > 0 ? "+" : ""}${t}%</text>`; });
  rows.forEach((s, r) => {
    const y = top + r * rowH + 6;
    o += `<text x="0" y="${y + 15}" style="fill:var(--fg);font-weight:600">${ROMAN[s.i]}</text><text x="26" y="${y + 15}">${s.K.length} K · ${s.M.length} M</text>`;
    if (s.g == null) { o += `<text x="${x(0) + 6}" y="${y + 15}">brak porównania</text>`; return; }
    const col = s.level === "crit" ? "var(--crit)" : s.level === "warn" ? "var(--warn)" : s.level === "justified" ? "var(--muted)" : "var(--ok)";
    const x0 = x(Math.min(0, s.g)), w = Math.abs(x(s.g) - x(0));
    o += `<rect x="${x0}" y="${y}" width="${Math.max(w, 2)}" height="20" rx="3" fill="${col}"/>`;
    const lx = s.g >= 0 ? x(s.g) + 6 : x(s.g) - 6;
    o += `<text x="${lx}" y="${y + 15}" text-anchor="${s.g >= 0 ? "start" : "end"}" style="fill:var(--fg);font-family:var(--f-mono);font-weight:600">${pct(s.g)}</text>`;
  });
  o += `<text x="${x(0) + 4}" y="12">na korzyść M →</text><text x="${x(0) - 4}" y="12" text-anchor="end">← na korzyść K</text></svg>`;
  return o;
}
function quartChart(q) {
  const W = 520, rowH = 38, left = 130, H = q.length * rowH + 8;
  const names = ["Q1 najniższe", "Q2", "Q3", "Q4 najwyższe"];
  let o = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Udział kobiet i mężczyzn w kwartylach płac">`;
  q.forEach((r, i) => {
    const y = i * rowH + 4, tot = r.k + r.m || 1, wk = (W - left) * r.k / tot;
    o += `<text x="0" y="${y + 13}" style="fill:var(--fg);font-weight:600">${names[i]}</text><text x="0" y="${y + 28}">${fmt(r.lo)}–${fmt(r.hi)} zł</text>`;
    o += `<rect x="${left}" y="${y}" width="${wk}" height="28" fill="var(--k)"/><rect x="${left + wk}" y="${y}" width="${W - left - wk}" height="28" fill="var(--m)"/>`;
    if (r.k) o += `<text x="${left + 6}" y="${y + 19}" style="fill:#fff;font-weight:700">K ${Math.round(r.k / tot * 100)}%</text>`;
    if (r.m) o += `<text x="${W - 6}" y="${y + 19}" text-anchor="end" style="fill:#fff;font-weight:700">M ${Math.round(r.m / tot * 100)}%</text>`;
  });
  return o + "</svg>";
}
function scatter() {
  const W = 1000, H = 400, l = 64, r = 14, t = 14, b = 40;
  const data = S.employees.map(e => { const p = posById(e.pos); return p ? { e, x: points(p), y: pay(e) } : null; }).filter(Boolean);
  if (!data.length) return "";
  const xs = data.map(d => d.x), ys = data.map(d => d.y);
  const x0 = Math.floor((Math.min(...xs) - 30) / 100) * 100, x1 = Math.ceil((Math.max(...xs) + 30) / 100) * 100;
  const y1 = Math.ceil(Math.max(...ys) / 2000) * 2000, y0 = Math.max(0, Math.floor(Math.min(...ys) / 2000) * 2000);
  const X = v => l + (v - x0) / (x1 - x0) * (W - l - r), Y = v => t + (1 - (v - y0) / (y1 - y0)) * (H - t - b);
  let o = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Punkty wartościowania a wynagrodzenie">`;
  for (let v = y0; v <= y1; v += 2000) o += `<line class="axis" x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke-opacity=".6"/><text x="${l - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v / 1000)} tys.</text>`;
  S.company.bands.forEach((bd, i) => { if (bd > x0 && bd < x1) o += `<line class="axis" x1="${X(bd)}" x2="${X(bd)}" y1="${t}" y2="${H - b}" stroke-dasharray="4 4"/>`; const nx = S.company.bands[i + 1] ?? x1; const mid = (Math.max(bd, x0) + Math.min(nx, x1)) / 2; if (mid > x0 && mid < x1) o += `<text x="${X(mid)}" y="${H - b + 16}" text-anchor="middle" style="font-weight:700">${ROMAN[i]}</text>`; });
  o += `<text x="${(W + l) / 2}" y="${H - 4}" text-anchor="middle">punkty wartościowania stanowiska</text>`;
  // linia polityki płacowej (regresja liniowa)
  const n = data.length, mx = mean(xs), my = mean(ys);
  const sl = data.reduce((s, d) => s + (d.x - mx) * (d.y - my), 0) / (data.reduce((s, d) => s + (d.x - mx) ** 2, 0) || 1);
  const ic = my - sl * mx;
  o += `<line x1="${X(x0)}" y1="${Y(ic + sl * x0)}" x2="${X(x1)}" y2="${Y(ic + sl * x1)}" stroke="var(--fg)" stroke-opacity=".45" stroke-width="2" stroke-dasharray="6 4"/>`;
  data.forEach(d => { const jit = ((parseInt(d.e.id.replace(/\D/g, "")) || 0) % 7 - 3) * 1.6; o += `<circle cx="${X(d.x) + jit}" cy="${Y(d.y)}" r="4.5" fill="var(--${d.e.sex === "K" ? "k" : "m"})" fill-opacity=".8"><title>${esc(d.e.id)} · ${esc(posById(d.e.pos).name)} · ${d.e.sex} · ${zl(d.y)}</title></circle>`; });
  return o + "</svg>";
}

function vPulpit() {
  const st = catStats(), all = S.employees;
  const g = gapOf(all), gm = gapOf(all, payBasis, median);
  const flagged = st.filter(s => s.level === "crit");
  const tol = Number(S.company.threshold) || 5;
  const cost = flagged.reduce((s, c) => s + equalize(c.emps, 0, payBasis).cost, 0);
  const annual = cost * 12 * (1 + (Number(S.company.zus) || 0) / 100);
  const duty = reportDuty(S.company.headcount);
  const alerts = [];
  if (flagged.length) alerts.push(["crit", `<b>${flagged.length === 1 ? "Kategoria" : "Kategorie"} ${flagged.map(s => ROMAN[s.i] + " (" + pct(s.g) + ")").join(", ")}</b> ${flagged.length === 1 ? "przekracza" : "przekraczają"} próg ${tol}% bez uzasadnienia. Jeśli luka nie zostanie wyjaśniona obiektywnymi kryteriami ani usunięta w ciągu 6 miesięcy od raportu, konieczna będzie wspólna ocena wynagrodzeń z przedstawicielami pracowników. Uzupełnij status w zakładce Kategorie.`]);
  st.filter(s => s.level === "justified").forEach(s => alerts.push(["warn", `<b>Kategoria ${ROMAN[s.i]}: luka ${pct(s.g)}</b> oznaczona jako uzasadniona. Upewnij się, że uzasadnienie opiera się na obiektywnych, neutralnych płciowo kryteriach i jest udokumentowane.`]));
  st.filter(s => s.g != null && s.small && s.level !== "crit").forEach(s => alerts.push(["warn", `<b>Kategoria ${ROMAN[s.i]}</b>: mniej niż 3 osoby jednej płci (${s.K.length} K, ${s.M.length} M). Wynik jest wrażliwy na pojedyncze wynagrodzenia i może ujawniać dane osobowe w raporcie.`]));
  st.filter(s => s.emps.length && s.g == null).forEach(s => alerts.push(["warn", `<b>Kategoria ${ROMAN[s.i]}</b> jest jednopłciowa (${s.emps.length} os.), więc luki nie da się policzyć. Sprawdź, czy stanowiska w innych kategoriach nie są zaniżone lub zawyżone w wartościowaniu.`]));
  const q = quartiles();
  if (q[3].k / ((q[3].k + q[3].m) || 1) < q[0].k / ((q[0].k + q[0].m) || 1) - .15) alerts.push(["warn", `<b>Segregacja pionowa:</b> kobiety stanowią ${Math.round(q[0].k / (q[0].k + q[0].m) * 100)}% najniższego kwartyla płac i tylko ${Math.round(q[3].k / (q[3].k + q[3].m) * 100)}% najwyższego.`]);
  if (!alerts.length) alerts.push(["ok", "Żadna kategoria nie przekracza progu. Utrzymuj dokumentację kryteriów i powtarzaj analizę po każdej rewizji płac."]);
  return `${sampleBanner()}
  <section><div class="sec-head"><h2>${esc(S.company.name)}</h2>${basisToggle()}</div>
  <div class="kpis">
    <div class="kpi"><span class="lbl">Luka ogółem · średnia</span><span class="val">${pct(g)}</span><span class="sub">${g > 0 ? "na korzyść mężczyzn" : g < 0 ? "na korzyść kobiet" : ""} · ${all.filter(e => e.sex === "K").length} K / ${all.filter(e => e.sex === "M").length} M</span></div>
    <div class="kpi"><span class="lbl">Luka ogółem · mediana</span><span class="val">${pct(gm)}</span><span class="sub">odporna na skrajne pensje</span></div>
    <div class="kpi"><span class="lbl">Kategorie ≥ ${tol}%</span><span class="val">${flagged.length}<span class="muted" style="font-size:1rem"> / ${st.filter(s => s.g != null).length}</span></span><span class="sub">bez uzasadnienia, wymagają działań</span></div>
    <div class="kpi"><span class="lbl">Koszt pełnego wyrównania</span><span class="val">${fmt(annual / 1000, 0)} tys.</span><span class="sub">zł rocznie z ZUS pracodawcy · ${zl(cost)} mies.</span></div>
  </div></section>
  <section><h2>Na co zwrócić uwagę</h2><div class="alerts">${alerts.map(a => `<div class="alert ${a[0]}"><span class="chip ${a[0]}">${a[0] === "crit" ? "Działaj" : a[0] === "warn" ? "Sprawdź" : "OK"}</span><div>${a[1]}</div></div>`).join("")}</div></section>
  <div class="grid2">
    <section class="card"><h3>Luka w kategoriach pracy o jednakowej wartości</h3><p class="muted small">(średnia M − średnia K) / średnia M. Zielony pas to dopuszczalny próg.</p>${gapChart(st)}</section>
    <section class="card"><h3>Kwartyle płac</h3><p class="muted small">Wymagany element raportu: udział płci w każdej ćwiartce listy płac.</p>${quartChart(q)}<div class="legend"><span><i class="dot K"></i>Kobiety</span><span><i class="dot M"></i>Mężczyźni</span></div></section>
  </div>
  <section class="card"><div class="sec-head"><h3>Linia polityki płacowej</h3><div class="legend"><span><i class="dot K"></i>K</span><span><i class="dot M"></i>M</span><span>– – trend płac względem wartości pracy</span></div></div>
  <p class="muted small">Każdy punkt to osoba. Punkty wyraźnie pod linią przy danej wartości stanowiska to kandydaci do przeglądu, niezależnie od płci.</p>${scatter()}</section>
  <section class="card"><div class="sec-head"><h3>Obowiązek raportowania</h3><span class="chip ${duty.lvl}">${duty.t}</span></div><p>${duty.d} Liczba pracowników w Ustawieniach: <b>${fmt(S.company.headcount)}</b>.</p></section>`;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Skopiowano"); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Skopiowano"); } catch (x) { toast("Zaznacz tekst i skopiuj ręcznie"); } ta.remove(); }
}

function parseCsv(txt) {
  txt = txt.replace(/^﻿/, "");
  const lines = txt.split(/\r?\n/).filter(l => l.trim());
  const sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ";" : ",";
  const split = l => { const out = []; let cur = "", q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out.map(s => s.trim()); };
  return lines.map(split);
}
function importCsv(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const rows = parseCsv(String(rd.result));
      const head = rows[0].map(h => h.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace("ł", "l"));
      const col = (...names) => head.findIndex(h => names.some(n => h.startsWith(n)));
      const ci = { id: col("id"), pos: col("stanowisko", "position"), sex: col("plec", "sex", "gender"), base: col("zasadnicze", "base", "pensja"), variable: col("zmienne", "premia", "variable"), fte: col("etat", "fte"), tenure: col("staz", "tenure") };
      if (ci.pos < 0 || ci.sex < 0 || ci.base < 0) { toast("Brak wymaganych kolumn: stanowisko, plec, zasadnicze"); return; }
      const num = s => Number(String(s ?? "").replace(/\s/g, "").replace(",", ".")) || 0;
      const emps = []; let added = 0;
      rows.slice(1).forEach((r, k) => {
        const pname = r[ci.pos]; if (!pname) return;
        let p = S.positions.find(x => x.name.toLowerCase() === pname.toLowerCase());
        if (!p) { p = { id: "s" + Date.now().toString(36) + k, name: pname, dept: "", levels: Object.fromEntries(S.criteria.map(c => [c.id, 3])) }; S.positions.push(p); added++; }
        const sx = String(r[ci.sex] || "").trim().toUpperCase().startsWith("M") ? "M" : "K";
        const fte = ci.fte >= 0 ? num(r[ci.fte]) : 1;
        emps.push({ id: (ci.id >= 0 && r[ci.id]) || "P-" + String(k + 1).padStart(3, "0"), pos: p.id, sex: sx, base: num(r[ci.base]), variable: ci.variable >= 0 ? num(r[ci.variable]) : 0, fte: fte > 0 && fte <= 1 ? fte : 1, tenure: ci.tenure >= 0 ? num(r[ci.tenure]) : 0 });
      });
      if (!emps.length) { toast("Plik nie zawiera wierszy z danymi"); return; }
      S.employees = emps; S.sample = false;
      change(); toast(`Wczytano ${emps.length} osób` + (added ? `, nowe stanowiska: ${added}. Oceń je w Wartościowaniu.` : ""));
    } catch (e) { toast("Nie udało się odczytać pliku CSV"); }
  };
  rd.readAsText(file, "utf-8");
}

async function exportCsv() {
  const st = catStats(), q = quartiles();
  const L = [], c = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const n2 = v => isFinite(v) ? v.toFixed(2).replace(".", ",") : "";
  L.push(["Raport luki płacowej", S.company.name, new Date().toLocaleDateString("pl-PL"), payBasis === "total" ? "wynagrodzenie całkowite" : "zasadnicze"]);
  L.push([]); L.push(["Ogółem", "luka średnia %", n2(gapOf(S.employees)), "luka mediana %", n2(gapOf(S.employees, payBasis, median))]);
  L.push([]); L.push(["Kwartyl", "K", "M", "% K", "od zł", "do zł"]);
  q.forEach((r, i) => L.push(["Q" + (i + 1), r.k, r.m, n2(r.k / ((r.k + r.m) || 1) * 100), n2(r.lo), n2(r.hi)]));
  L.push([]); L.push(["Kategoria", "punkty", "stanowiska", "K", "M", "średnia K", "średnia M", "luka średnia %", "luka mediana %", "luka zasadnicze %", "status", "uzasadnienie"]);
  st.forEach(s => { const note = S.notes[s.i] || {}; L.push([ROMAN[s.i], catLabel(s.i).split(" · ")[1], s.pos.map(p => p.name).join(" | "), s.K.length, s.M.length, n2(s.meanK), n2(s.meanM), n2(s.g), n2(s.gm), n2(s.gb), note.status || "", note.text || ""]); });
  L.push([]); L.push(["Stanowisko", "dział", ...S.criteria.map(x => x.name), "punkty", "kategoria"]);
  S.positions.forEach(p => L.push([p.name, p.dept, ...S.criteria.map(x => p.levels[x.id]), points(p), ROMAN[catOf(points(p))]]));
  const csv = "﻿" + L.map(r => r.map(c).join(";")).join("\r\n");
  if (!downloadsNs) { copy(csv); toast("Pobieranie niedostępne: raport skopiowano do schowka"); return; }
  try { await downloadsNs.save({ filename: "raport-luki-placowej.csv", data: csv }); }
  catch (e) { if (e && e.code === "declined") return; if (e && e.code === "rate_limited") { toast("Poczekaj chwilę i spróbuj ponownie"); return; } toast("Nie udało się zapisać pliku"); }
}

async function save() {
  if (!artifactNs || readOnly) return;
  const btn = $("#btnSave"); btn.disabled = true; $("#saveState").textContent = "Zapisywanie…";
  try {
    await artifactNs.publish({ "data.json": JSON.stringify(S, null, 1) });
    setDirty(false); toast("Zapisano");
  } catch (e) {
    const code = e && e.code;
    if (code === "conflict") { $("#saveState").textContent = "Ktoś zapisał wcześniej, wczytuję nowszą wersję"; return; }
    if (["not_writer", "not_granted", "consent_required", "capability_disabled", "capability_removed", "not_declared"].includes(code)) { readOnly = true; setDirty(dirty); toast("Ten widok jest tylko do odczytu, zapis niedostępny"); return; }
    if (code === "rate_limited") { toast("Zbyt częste zapisy, spróbuj za chwilę"); setDirty(true); return; }
    toast("Zapis się nie udał, spróbuj ponownie"); setDirty(true);
  }
}

async function boot() {
  let data = null;
  try { const r = await fetch("data.json", { cache: "no-store" }); if (r.ok) data = await r.json(); } catch (e) {}
  S = data && data.employees ? data : JSON.parse(JSON.stringify(SEED));
  S.notes ||= {}; S.checklist ||= {};
  let restored = false;
  try { const d = sessionStorage.getItem("rp-draft"); if (d) { S = JSON.parse(d); restored = true; } } catch (e) {}
  render(); setDirty(restored);
  if (restored) toast("Przywrócono niezapisane zmiany");
  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(a => { artifactNs = a; if (!a) { readOnly = true; } setDirty(dirty); }).catch(() => { readOnly = true; setDirty(dirty); });
    window.claude.use("downloads").then(d => { downloadsNs = d; }).catch(() => {});
  } else { readOnly = true; setDirty(dirty); }
}
boot();
})();
</script>
